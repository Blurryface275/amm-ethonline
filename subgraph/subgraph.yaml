specVersion: 1.0.0
description: >-
  Indexes Uniswap v4 PoolManager Initialize/Swap events for pools using
  AdaptiveFeeHook, as raw price history for offchain volatility computation
  (see functions/volatility-source.js).
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PoolManager
    # PLACEHOLDER — network and address are unconfirmed. claude.md calls out
    # that the event's testnet choice needs confirming with the team before
    # this is deployable; both fields must be filled in once that happens.
    # PoolManager is a singleton across all v4 pools, so this indexes every
    # pool's Initialize/Swap, not just ones using our hook — mapping.ts
    # relies on the `hooks` field on Initialize to scope down to pools that
    # use AdaptiveFeeHook.
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: PoolManager
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - Swap
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
      eventHandlers:
        - event: Initialize(indexed bytes32,indexed address,indexed address,uint24,int24,address,uint160,int24)
          handler: handleInitialize
        - event: Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)
          handler: handleSwap
      file: ./src/mapping.ts
